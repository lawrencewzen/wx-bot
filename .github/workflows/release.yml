name: release

on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - run: cd packages/cli && bun run scripts/cross.ts "$GITHUB_REF_NAME"
      - run: cd dist && sha256sum wx-bot_* > checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -e "s/__VERSION__/${GITHUB_REF_NAME}/g" -e "s/__VERSION_NUM__/${GITHUB_REF_NAME#v}/g" \
            .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          # The upgrade guide comes first; GitHub appends the generated change list.
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
